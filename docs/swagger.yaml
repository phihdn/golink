basePath: /
definitions:
  handler.shortenLinkInput:
    properties:
      exp:
        description: |-
          Exp is the link lifetime in seconds, at most 7 days (604800).
          0 or omitted means the link never expires.
        example: 604800
        maximum: 604800
        minimum: 0
        type: integer
      url:
        example: https://example.com/some/long/path
        type: string
    required:
    - url
    type: object
  handler.shortenLinkResponse:
    properties:
      code:
        example: aB3dE6g
        type: string
      message:
        example: Shorten URL generated successfully!
        type: string
    type: object
  model.BadRequestError:
    properties:
      error:
        example: Invalid Input
        type: string
    type: object
  model.ErrorResponse:
    properties:
      message:
        example: Internal Server Error
        type: string
    type: object
  model.Health:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  model.InternalServerError:
    properties:
      error:
        example: Internal Server Error
        type: string
    type: object
  model.NotFoundError:
    properties:
      error:
        example: Not Found
        type: string
    type: object
info:
  contact: {}
  description: URL shortener service.
  title: golink API
  version: "1.0"
paths:
  /health-check:
    get:
      description: Returns the service name and instance id. Returns 500 when Redis
        does not answer a ping.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Health'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.InternalServerError'
      summary: Health check
      tags:
      - health
  /v1/gen-pass:
    get:
      description: Returns a random 10-character alphanumeric password as plain text.
      produces:
      - text/plain
      responses:
        "200":
          description: aB3dE6gH9j
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Generate a password
      tags:
      - password
  /v1/links/redirect/{code}:
    get:
      description: Look up the code and answer 302 Found with the original url in
        the Location header.
      parameters:
      - description: Short code
        example: aB3dE6g
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BadRequestError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.InternalServerError'
      summary: Redirect a short code to its original url
      tags:
      - link
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Generate a unique 7-character code for the url. exp is the lifetime
        in seconds, 0 or omitted means no expiration.
      parameters:
      - description: Input required
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handler.shortenLinkInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.shortenLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.BadRequestError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.InternalServerError'
      summary: Generate shorten url based on original url
      tags:
      - link
swagger: "2.0"
